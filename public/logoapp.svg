    <!-- Pink rounded shape -->
    <path d="
      M60 16
      C60 8 66 4 74 4
      L80 4
      L80 76
      L74 76
      C66 76 60 72 60 64
      Z"
      fill="#EC4899"/>
  </g>

  <!-- Brand Name -->
  <text
    x="84"
    y="49"
    font-family="Rethink Sans, Inter, Arial, sans-serif"
    font-size="42"
    font-weight="800"
    fill="#000000"
    letter-spacing="-1">
    TallerPro
  </text>
</svg>