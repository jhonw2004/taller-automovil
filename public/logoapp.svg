<svg xmlns="http://www.w3.org/2000/svg" width="290" height="72" viewBox="0 0 290 72" role="img" aria-labelledby="title">
  <title>TallerPro Logo</title>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(-8,-4)">
    <!-- Blue circle -->
    <circle cx="20" cy="60" r="12" fill="#4DA3FF"/>

    <!-- Purple vertical shape -->
    <path d="
